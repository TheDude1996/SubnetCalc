name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests ausführen
        run: ./gradlew :core:test

      - name: Release-Keystore aus Secret wiederherstellen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        run: ./gradlew :app:assembleRelease

      - name: Signierte Release-APK hochladen
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: SubnetCalc-release
          path: app/build/outputs/apk/release/app-release.apk

      # Jeder Build auf dem Standard-Branch sowie jeder manuell gestartete
      # Lauf wird als GitHub-Release mit der signierten APK veröffentlicht.
      - name: GitHub-Release veröffentlichen
        if: env.KEYSTORE_FILE != '' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "SubnetCalc-${VERSION}.apk"
          gh release create "v${VERSION}" "SubnetCalc-${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "SubnetCalc ${VERSION}" \
            --generate-notes

      # Ohne Secrets (z. B. in Forks) gibt es ersatzweise eine Debug-APK,
      # die sich aber nicht als Update installieren lässt.
      - name: Debug-APK bauen (ohne Signatur-Secrets)
        if: env.KEYSTORE_FILE == ''
        run: ./gradlew :app:assembleDebug

      - name: Debug-APK hochladen (ohne Signatur-Secrets)
        if: env.KEYSTORE_FILE == ''
        uses: actions/upload-artifact@v4
        with:
          name: SubnetCalc-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Testberichte hochladen (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
